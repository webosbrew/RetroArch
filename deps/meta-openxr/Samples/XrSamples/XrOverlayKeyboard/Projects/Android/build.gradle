buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'


android {
    compileSdk 34
    namespace "com.oculus.sdk.xroverlaykeyboard"

    defaultConfig {
        applicationId "com.oculus.sdk.xroverlaykeyboard"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            ndk {
                abiFilters 'arm64-v8a'
            }
            ndkBuild {
                abiFilters 'arm64-v8a'
            }

            cmake {
                targets "xroverlaykeyboard"
                cppFlags "-std=c++20"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['../../java']
            assets.srcDirs = ['../../assets']
            res.srcDirs = ['../../res']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../../../CMakeLists.txt')
        }
    }

    buildFeatures {
        prefab true
    }

    ndkVersion '27.0.12077973'
}

dependencies {
    // OpenXR dependency (for native library)
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.52'

    // Basic Android dependencies (no Compose needed for MainActivity.java)
    implementation "androidx.appcompat:appcompat:1.6.1"
}
